name: VAYNZOX PRO MAX

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip uninstall -y google-generativeai google-generative-ai 2>/dev/null || true
          pip install --no-cache-dir -r requirements.txt
      - name: Run PRO MAX Studio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: python main.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaynzox-pro-max-video
          path: output/
          retention-days: 7
